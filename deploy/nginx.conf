server {
    listen 80;
    server_name _;  # Ganti dengan domain/IP server Anda, contoh: woodchip.perusahaan.com

    # Max upload size untuk foto woodchip dan timbangan
    client_max_body_size 20M;

    # Proxy ke FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Serve file upload langsung lewat Nginx (lebih cepat)
    location /uploads/ {
        alias /opt/woodchip-app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve static files langsung lewat Nginx
    location /static/ {
        alias /opt/woodchip-app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
